name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check custom_components tests

      - name: Mypy (strict)
        run: uv run mypy --strict custom_components/geosphere_weather

      - name: Pytest
        run: uv run pytest
